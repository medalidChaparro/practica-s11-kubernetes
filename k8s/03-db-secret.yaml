apiVersion: v1
kind: Secret
metadata:
  name: mongo-secret
  namespace: practica-s11
type: Opaque
# NOTA DE SEGURIDAD:
# Los valores mostrados abajo son marcadores de ejemplo para entornos de desarrollo/pruebas.
# En un entorno productivo, reemplace estos valores por credenciales robustas y nunca
# almacene contraseñas en texto plano en repositorios públicos.
# Alternativamente, puede codificar en base64 usando: echo -n 'tu_password' | base64
stringData:
  MONGO_INITDB_ROOT_USERNAME: "admin"            # <-- REEMPLAZAR: Usuario administrador de MongoDB
  MONGO_INITDB_ROOT_PASSWORD: "password123"      # <-- REEMPLAZAR: Contraseña de MongoDB

