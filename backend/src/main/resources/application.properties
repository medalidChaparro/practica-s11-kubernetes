# ===================================================================
# Configuración del Servidor Spring WebFlux
# ===================================================================
server.port=${APP_PORT:8080}

# ===================================================================
# Configuración Reactiva de MongoDB
# Variables inyectadas desde ConfigMap (app-config) y Secret (mongo-secret)
# ===================================================================
spring.data.mongodb.uri=mongodb://${MONGO_INITDB_ROOT_USERNAME:admin}:${MONGO_INITDB_ROOT_PASSWORD:password123}@${DB_HOST:mongo-service}:${DB_PORT:27017}/${DB_NAME:agrotecno_db}?authSource=admin

# Mapeo de propiedades directas
spring.data.mongodb.host=${DB_HOST:mongo-service}
spring.data.mongodb.port=${DB_PORT:27017}
spring.data.mongodb.database=${DB_NAME:agrotecno_db}
spring.data.mongodb.username=${MONGO_INITDB_ROOT_USERNAME:admin}
spring.data.mongodb.password=${MONGO_INITDB_ROOT_PASSWORD:password123}
spring.data.mongodb.authentication-database=admin

# ===================================================================
# Spring Boot Actuator para Kubernetes Probes (Liveness & Readiness)
# ===================================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

